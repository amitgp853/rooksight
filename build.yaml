# Code generation runs only where it's needed (keeps build_runner fast).
targets:
  $default:
    builders:
      drift_dev:
        generate_for:
          - lib/core/storage/**
      llm_tool_generator:llm_tool:
        generate_for:
          - lib/features/coach/domain/coach_tools.dart
      source_gen:combining_builder:
        generate_for:
          - lib/core/storage/**
          - lib/features/coach/domain/coach_tools.dart
