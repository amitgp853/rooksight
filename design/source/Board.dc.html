<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MoveWise board</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./motion.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=JetBrains+Mono:wght@500&display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="img" aria-label="Chess board" style="position: relative; width: {{size}}px; height: {{size}}px; border-radius: {{radius}}px; overflow: hidden; color: #131920">

<div style="position: absolute; left: 0; top: 0; width: {{size}}px; height: {{size}}px; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr))">
<sc-for list="{{squares}}" as="sq" hint-placeholder-count="64">
<div style="position: relative; background: {{sq.bg}}; box-shadow: {{sq.ring}}">

<sc-if value="{{sq.tint}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: {{sq.tintBg}}; box-shadow: {{sq.tintShadow}}; opacity: {{sq.tintOp}}; animation: {{sq.tintAnim}}"></div>
</sc-if>

<sc-if value="{{sq.showRank}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; top: 2px; left: 3px; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: {{coordSize}}px; line-height: 1; color: {{sq.cc}}">{{sq.rank}}</span>
</sc-if>
<sc-if value="{{sq.showFile}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; bottom: 2px; right: 3px; font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: {{coordSize}}px; line-height: 1; color: {{sq.cc}}">{{sq.file}}</span>
</sc-if>

<sc-if value="{{sq.ghost}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; z-index: 1; opacity: 0; animation: {{sq.gAnim}}">
<svg viewBox="0 0 48 48" width="{{ps}}" height="{{ps}}" aria-hidden="true" style="display: block; overflow: visible; filter: drop-shadow(0 1.5px 1.5px rgba(0,0,0,0.35))"><path d="{{sq.g.b}}" style="fill: {{sq.g.fill}}; stroke: {{sq.g.stroke}}; stroke-width: {{sq.g.sw}}; stroke-linejoin: round; paint-order: stroke"></path><path d="{{sq.g.d}}" style="fill: none; stroke: {{sq.g.dcol}}; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"></path></svg>
</div>
</sc-if>

<sc-if value="{{sq.has}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; z-index: {{sq.z}}; opacity: {{sq.pOp}}; --dx: {{sq.dx}}px; --dy: {{sq.dy}}px; animation: {{sq.pAnim}}">
<svg viewBox="0 0 48 48" width="{{ps}}" height="{{ps}}" aria-hidden="true" style="display: block; overflow: visible; filter: drop-shadow(0 1.5px 1.5px rgba(0,0,0,0.35))"><path d="{{sq.pc.b}}" style="fill: {{sq.pc.fill}}; stroke: {{sq.pc.stroke}}; stroke-width: {{sq.pc.sw}}; stroke-linejoin: round; paint-order: stroke"></path><path d="{{sq.pc.d}}" style="fill: none; stroke: {{sq.pc.dcol}}; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"></path></svg>
</div>
</sc-if>

<sc-if value="{{sq.dot}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 35%; top: 35%; width: 30%; height: 30%; border-radius: 50%; background: rgba(14,18,23,0.32); z-index: 3; animation: {{sq.popAnim}}"></div>
</sc-if>
<sc-if value="{{sq.cap}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; border-radius: 50%; box-shadow: inset 0 0 0 {{capW}}px rgba(14,18,23,0.34); z-index: 3; animation: {{sq.popAnim}}"></div>
</sc-if>
<sc-if value="{{sq.castle}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 3px; top: 3px; right: 3px; bottom: 3px; border-radius: 50%; border: 2.5px dashed #E3B25C; z-index: 3; animation: {{sq.popAnim}}"></div>
</sc-if>

<sc-if value="{{sq.mark}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; top: 2px; right: 2px; z-index: 6; width: {{markSize}}px; height: {{markSize}}px; border-radius: 50%; background: {{sq.markBg}}; color: #0B1224; display: flex; align-items: center; justify-content: center; font-family: Sora, sans-serif; font-weight: 700; font-size: {{markFont}}px; letter-spacing: -0.04em; box-shadow: 0 1px 4px rgba(0,0,0,0.45)">{{sq.markT}}</span>
</sc-if>
</div>
</sc-for>
</div>

<sc-if value="{{arrow.on}}" hint-placeholder-val="{{false}}">
<svg width="{{size}}" height="{{size}}" viewBox="{{arrow.vb}}" aria-hidden="true" style="position: absolute; left: 0; top: 0; z-index: 8; pointer-events: none; overflow: visible">
<path d="{{arrow.d}}" style="fill: none; stroke: #E3B25C; stroke-opacity: 0.92; stroke-width: {{arrow.w}}; stroke-linecap: round; stroke-dasharray: {{arrow.len}}; stroke-dashoffset: 0; --len: {{arrow.len}}; animation: {{arrow.anim}}"></path>
<polygon points="{{arrow.head}}" style="fill: #E3B25C; fill-opacity: 0.92; animation: {{arrow.headAnim}}"></polygon>
</svg>
</sc-if>

<sc-if value="{{lift.on}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: {{lift.x}}px; top: {{lift.y}}px; width: {{sqpx}}px; height: {{sqpx}}px; display: flex; align-items: center; justify-content: center; z-index: 12; transform: {{lift.tf}}; animation: {{lift.anim}}">
<svg viewBox="0 0 48 48" width="{{ps}}" height="{{ps}}" aria-hidden="true" style="display: block; overflow: visible; filter: drop-shadow(0 10px 8px rgba(0,0,0,0.5))"><path d="{{lift.pc.b}}" style="fill: {{lift.pc.fill}}; stroke: {{lift.pc.stroke}}; stroke-width: {{lift.pc.sw}}; stroke-linejoin: round; paint-order: stroke"></path><path d="{{lift.pc.d}}" style="fill: none; stroke: {{lift.pc.dcol}}; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"></path></svg>
</div>
</sc-if>

<sc-if value="{{promo.on}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 0; width: {{size}}px; height: {{size}}px; background: rgba(8,11,15,0.58); z-index: 20; animation: {{promo.scrimAnim}}"></div>
<div role="group" aria-label="Promote pawn to" style="position: absolute; left: {{promo.x}}px; top: {{promo.y}}px; width: {{promo.w}}px; z-index: 21; box-sizing: border-box; padding: 4px; border-radius: 14px; background: #1C242E; border: 1px solid #34466F; box-shadow: 0 14px 30px rgba(0,0,0,0.55); display: flex; flex-direction: {{promo.dir}}; gap: 2px; transform-origin: {{promo.origin}}; animation: {{promo.anim}}">
<sc-for list="{{promo.items}}" as="it" hint-placeholder-count="4">
<button type="button" aria-label="{{it.label}}" style="height: {{it.h}}px; border: none; border-radius: 10px; background: {{it.bg}}; box-shadow: {{it.ring}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg viewBox="0 0 48 48" width="{{it.s}}" height="{{it.s}}" aria-hidden="true" style="display: block; overflow: visible; filter: drop-shadow(0 1.5px 1.5px rgba(0,0,0,0.35))"><path d="{{it.pc.b}}" style="fill: {{it.pc.fill}}; stroke: {{it.pc.stroke}}; stroke-width: {{it.pc.sw}}; stroke-linejoin: round; paint-order: stroke"></path><path d="{{it.pc.d}}" style="fill: none; stroke: {{it.pc.dcol}}; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"></path></svg>
</button>
</sc-for>
<button type="button" aria-label="Cancel promotion" style="height: 34px; border: none; border-radius: 10px; background: transparent; color: #A3AFBD; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
</sc-if>

</div>
</x-dc>

    }

    return {

      radius: Number(p.radius != null && p.radius !== '' ? p.radius : 0),
      ps: Math.round(sq * 0.9),
      capW: Math.round(sq * 0.09 * 10) / 10,
      coordSize: Math.max(8, Math.round(sq * 0.21)),
      markSize: Math.round(Math.max(16, sq * 0.44)),

  }
