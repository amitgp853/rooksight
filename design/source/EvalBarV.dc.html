<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eval bar · vertical</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div role="img" aria-label="{{aria}}" style="position: relative; width: 18px; height: {{h}}px; border-radius: 4px; overflow: hidden; background: {{top.grad}}">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: {{botPct}}%; background: {{bot.grad}}; box-shadow: {{seam}}; transition: {{tr}}"></div>
<sc-if value="{{label.on}}" hint-placeholder-val="{{true}}">
<span style="position: absolute; left: 0; right: 0; top: {{label.t}}; bottom: {{label.b}}; text-align: center; font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 9px; line-height: 1; letter-spacing: -0.04em; color: {{label.fg}}">{{label.txt}}</span>
</sc-if>
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; box-sizing: border-box; border-radius: 4px; border: 1px solid {{stroke}}"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"cp":{"editor":"int","min":-2000,"max":2000,"default":140},"mate":{"editor":"int","min":-20,"max":20,"default":0},"analysed":{"editor":"boolean","default":true},"whiteBottom":{"editor":"boolean","default":true},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"motion":{"editor":"enum","options":["full","reduced"],"default":"full"},"height":{"editor":"int","min":100,"max":800,"default":368},"$preview":{"width":18,"height":368}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var yes = function (v) { return v === true || v === 'true'; };
    var analysed = p.analysed === undefined ? true : yes(p.analysed);
    var wb = p.whiteBottom === undefined ? true : yes(p.whiteBottom);
    var cp = Number(p.cp || 0), mate = Number(p.mate || 0);
    var W = { grad: 'linear-gradient(90deg, #F5F7FA, #DCE2EA)' }, B = { grad: 'linear-gradient(90deg, #1E2530, #141A22)' };
    var wp = 50, txt = '', ahead = null, aria = 'Evaluation not known yet';
    if (mate !== 0) { wp = mate > 0 ? 100 : 0; ahead = mate > 0 ? 'w' : 'b'; txt = 'M' + Math.abs(mate); aria = 'Mate in ' + Math.abs(mate) + ' for ' + (mate > 0 ? 'White' : 'Black'); }
    else if (analysed) {
      wp = Math.max(3, Math.min(97, 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * cp)) - 1)));
      ahead = cp >= 0 ? 'w' : 'b'; txt = (Math.abs(cp) / 100).toFixed(1);
      aria = 'Evaluation ' + (cp >= 0 ? '+' : '−') + txt + ', ' + (cp === 0 ? 'equal' : (cp > 0 ? 'White' : 'Black') + ' is better');
    }
    var botWhite = wb;
    var botPct = botWhite ? wp : 100 - wp;
    var aheadBottom = ahead && ((ahead === 'w') === botWhite);
    return {
      h: Number(p.height || 368),
      top: botWhite ? B : W, bot: botWhite ? W : B,
      botPct: Math.round(botPct * 10) / 10,
      seam: botPct > 0 && botPct < 100 ? '0 -1px 4px rgba(0,0,0,0.35)' : 'none',
      tr: p.motion === 'reduced' ? 'none' : 'height 240ms cubic-bezier(0.33, 1, 0.68, 1)',
      stroke: p.theme === 'light' ? 'rgba(95,107,122,0.55)' : 'rgba(124,136,152,0.55)',
      label: ahead ? { on: true, txt: txt, t: aheadBottom ? 'auto' : '5px', b: aheadBottom ? '5px' : 'auto', fg: ahead === 'w' ? '#1E2530' : '#F5F7FA' } : { on: false, txt: '', t: 'auto', b: 'auto', fg: 'transparent' },
      aria: aria
    };
  }
}
</script>
</body>
</html>
