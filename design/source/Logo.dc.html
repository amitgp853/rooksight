<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rooksight logo mark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<div role="img" aria-label="Rooksight logo" style="width: {{size}}px; height: {{size}}px; flex-shrink: 0; border-radius: {{radius}}px; background: {{c.tile}}; box-shadow: {{c.edge}}; overflow: hidden; display: flex; align-items: center; justify-content: center">

<sc-if value="{{is.v1a}}" hint-placeholder-val="{{true}}">
<svg viewBox="0 0 100 100" width="{{size}}" height="{{size}}" aria-hidden="true" style="display: block">
<g transform="{{tf}}">
<path d="M35 74H59V38" style="fill: none; stroke: {{c.pri}}; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round"></path>
<circle cx="35" cy="74" r="8" style="fill: {{c.pri}}"></circle>
<path d="M59 15L74 36H44Z" style="fill: {{c.acc}}; stroke: {{c.acc}}; stroke-width: 3; stroke-linejoin: round"></path>
</g>
</svg>
</sc-if>

<sc-if value="{{is.v1b}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" width="{{size}}" height="{{size}}" aria-hidden="true" style="display: block">
<g transform="{{tf}}">
<path d="M28 18h22v22H28zM50 40h22v22H50zM28 62h22v22H28z" style="fill: {{c.faint}}"></path>
<path d="M50 18h22v22H50zM28 40h22v22H28zM50 62h22v22H50z" style="fill: {{c.faint2}}"></path>
<path d="M39 73H61V40" style="fill: none; stroke: {{c.pri}}; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round"></path>
<circle cx="39" cy="73" r="6.5" style="fill: {{c.pri}}"></circle>
<path d="M61 14L73 32H49Z" style="fill: {{c.acc}}; stroke: {{c.acc}}; stroke-width: 3; stroke-linejoin: round"></path>
</g>
</svg>
</sc-if>

<sc-if value="{{is.v2a}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" width="{{size}}" height="{{size}}" aria-hidden="true" style="display: block">
<g transform="{{tf}}">
<g transform="translate(50 50) scale(0.88) translate(-57.5 -48)">
<path d="M25 84V52L35 30L39 18L47 28L69 44L71 56L57 58L49 54L59 84Z" style="fill: {{c.pri}}; stroke: {{c.pri}}; stroke-width: 2; stroke-linejoin: round"></path>
<circle cx="47" cy="38" r="3.5" style="fill: {{c.knock}}"></circle>
<path d="M78 12L80.5 21.5L90 24L80.5 26.5L78 36L75.5 26.5L66 24L75.5 21.5Z" style="fill: {{c.acc}}"></path>
</g>
</g>
</svg>
</sc-if>

<sc-if value="{{is.v2b}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" width="{{size}}" height="{{size}}" aria-hidden="true" style="display: block">
<g transform="{{tf}}">
<circle cx="50" cy="50" r="36" style="fill: {{c.pri}}"></circle>
<g transform="translate(50 52) scale(0.62) translate(-48 -51)">
<path d="M25 84V52L35 30L39 18L47 28L69 44L71 56L57 58L49 54L59 84Z" style="fill: {{c.knock}}; stroke: {{c.knock}}; stroke-width: 3; stroke-linejoin: round"></path>
<circle cx="47" cy="38" r="12" style="fill: {{c.acc}}; opacity: 0.32"></circle>
<circle cx="47" cy="38" r="6" style="fill: {{c.acc}}"></circle>
</g>
</g>
</svg>
</sc-if>

<sc-if value="{{is.v3a}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" width="{{size}}" height="{{size}}" aria-hidden="true" style="display: block">
<g transform="{{tf}}">
<rect x="26" y="26" width="48" height="48" rx="5" style="fill: {{c.pri}}"></rect>
<path d="M20 80L70 30" style="fill: none; stroke: {{c.knock}}; stroke-width: 20; stroke-linecap: round"></path>
<path d="M84 16L62.1 22.3L77.7 37.9Z" style="fill: {{c.acc}}; stroke: {{c.knock}}; stroke-width: 6; stroke-linejoin: round; paint-order: stroke"></path>
<path d="M20 80L70 30" style="fill: none; stroke: {{c.acc}}; stroke-width: 9; stroke-linecap: round"></path>
<path d="M84 16L62.1 22.3L77.7 37.9Z" style="fill: {{c.acc}}; stroke: {{c.acc}}; stroke-width: 2; stroke-linejoin: round"></path>
</g>
</svg>
</sc-if>

<sc-if value="{{is.v3b}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" width="{{size}}" height="{{size}}" aria-hidden="true" style="display: block">
<g transform="{{tf}}">
<rect x="30" y="26" width="46" height="46" rx="6" style="fill: none; stroke: {{c.pri}}; stroke-width: 8"></rect>
<path d="M14 72C38 72 54 62 70 38" style="fill: none; stroke: {{c.knock}}; stroke-width: 20; stroke-linecap: round"></path>
<path d="M14 72C38 72 54 62 70 38" style="fill: none; stroke: {{c.acc}}; stroke-width: 9; stroke-linecap: round"></path>
<path d="M81 22L78.5 44.5L60.5 30.5Z" style="fill: {{c.acc}}; stroke: {{c.acc}}; stroke-width: 2; stroke-linejoin: round"></path>
</g>
</svg>
</sc-if>

<sc-if value="{{is.v4a}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" width="{{size}}" height="{{size}}" aria-hidden="true" style="display: block">
<g transform="{{tf}}">
<path d="{{m.pri}}" style="fill: {{c.pri}}"></path>
<path d="{{m.pri2}}" style="fill: {{c.pri2}}"></path>
<path d="{{m.acc}}" style="fill: {{c.acc}}"></path>
</g>
</svg>
</sc-if>

<sc-if value="{{is.v4b}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 100 100" width="{{size}}" height="{{size}}" aria-hidden="true" style="display: block">
<g transform="{{tf}}">
<path d="{{m.boardA}}" style="fill: {{c.faint}}"></path>
<path d="{{m.boardB}}" style="fill: {{c.faint2}}"></path>
<path d="{{m.all}}" style="fill: {{c.pri}}"></path>
<path d="{{m.acc}}" style="fill: {{c.acc}}"></path>
</g>
</svg>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["1a","1b","2a","2b","3a","3b","4a","4b"],"default":"1a"},"mode":{"editor":"enum","options":["dark","light","monoDark","monoLight","onBlue"],"default":"dark"},"tile":{"editor":"boolean","default":true},"size":{"editor":"int","min":16,"max":1024,"default":200},"scale":{"editor":null},"radius":{"editor":null},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var v = String(p.variant || '1a');
    var size = Number(p.size != null && p.size !== '' ? p.size : 200);
    var tile = !(p.tile === false || p.tile === 'false');
    var sc = Number(p.scale != null && p.scale !== '' ? p.scale : 1);
    var modes = {
      dark:      { tile: '#151B22', pri: '#86A8FF', pri2: '#5A78C9', acc: '#E3B25C', faint: '#222B36', faint2: '#2A3441', edge: 'inset 0 0 0 1px rgba(255,255,255,0.06)' },
      light:     { tile: '#FFFFFF', pri: '#2F5BD3', pri2: '#6E8FE6', acc: '#C98A1B', faint: '#E6EAF0', faint2: '#D5DBE3', edge: 'inset 0 0 0 1px rgba(18,24,32,0.08)' },
      onBlue:    { tile: '#86A8FF', pri: '#0B1224', pri2: '#2A3A5E', acc: '#FFFFFF', faint: '#9DB7FF', faint2: '#B2C6FF', edge: 'none' },
      monoDark:  { tile: '#0E1217', pri: '#E9EDF2', pri2: '#E9EDF2', acc: '#E9EDF2', faint: 'rgba(233,237,242,0.14)', faint2: 'rgba(233,237,242,0.24)', edge: 'inset 0 0 0 1px rgba(255,255,255,0.08)' },
      monoLight: { tile: '#FFFFFF', pri: '#121820', pri2: '#121820', acc: '#121820', faint: 'rgba(18,24,32,0.10)', faint2: 'rgba(18,24,32,0.18)', edge: 'inset 0 0 0 1px rgba(18,24,32,0.1)' }
    };
    var m0 = modes[p.mode] || modes.dark;
    var c = Object.assign({}, m0, { knock: p.knock || m0.tile });
    if (!tile) { c.tile = 'transparent'; c.edge = 'none'; }
    if (p.tint) { c.pri = p.tint; c.pri2 = p.tint; c.acc = p.tint; }
    if (p.tileColor) { c.tile = p.tileColor; c.knock = p.tileColor; }

    var M = [[0,0],[0,4],[1,0],[1,1],[1,3],[1,4],[2,0],[2,2],[2,4],[3,0],[3,4],[4,0],[4,4]];
    var isM = {}; M.forEach(function (rc) { isM[rc[0] + ',' + rc[1]] = true; });
    var cell = function (r, cc) { var x = 20 + cc * 12, y = 20 + r * 12; return 'M' + x + ' ' + y + 'h12v12h-12z'; };
    var m = { pri: '', pri2: '', acc: '', all: '', boardA: '', boardB: '' };
    for (var r = 0; r < 5; r++) for (var k = 0; k < 5; k++) {
      var d = cell(r, k);
      if (r === 2 && k === 2) { m.acc += d; continue; }
      if (isM[r + ',' + k]) { m.all += d; if ((r + k) % 2 === 0) m.pri += d; else m.pri2 += d; }
      else { if ((r + k) % 2 === 0) m.boardA += d; else m.boardB += d; }
    }

    return {
      size: size,
      radius: tile ? Math.round(size * (p.radius != null && p.radius !== '' ? Number(p.radius) : 0.225)) : 0,
      c: c,
      m: m,
      tf: 'translate(50 50) scale(' + sc + ') translate(-50 -50)',
      is: { v1a: v === '1a', v1b: v === '1b', v2a: v === '2a', v2b: v === '2b', v3a: v === '3a', v3b: v === '3b', v4a: v === '4a', v4b: v === '4b' }
    };
  }
}
</script>
</body>
</html>
