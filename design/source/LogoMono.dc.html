<!doctype html>
<html lang="en">
<head>

<title>MoveWise monochrome logo</title>

</head>

<x-dc>
<helmet>

<style>body{margin:0;background:#0E1217}</style>
</helmet>
<div style="width: 1440px; height: 760px; box-sizing: border-box; padding: 64px; background: #0E1217; color: #E9EDF2; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 36px">

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 24px">

<div style="height: 240px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><dc-import name="Logo" variant="1a" mode="monoLight" tile="false" size="180" hint-size="180px,180px"></dc-import></div>

<div style="position: relative; width: 120px; height: 120px; overflow: hidden; border-radius: 50%; background: #DCE3F9"><div style="position: absolute; left: -30px; top: -30px"><dc-import name="Logo" variant="1a" mode="monoLight" tile="false" tint="#1D3A7A" scale="0.82" size="180" hint-size="180px,180px"></dc-import></div></div>
<div style="position: relative; width: 48px; height: 48px; overflow: hidden; border-radius: 50%; background: #DCE3F9"><div style="position: absolute; left: -12px; top: -12px"><dc-import name="Logo" variant="1a" mode="monoLight" tile="false" tint="#1D3A7A" scale="0.82" size="72" hint-size="72px,72px"></dc-import></div></div>
</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3AFBD">Android themed icon · light (tint from wallpaper)</span>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="height: 240px; border-radius: 20px; background: #10141C; display: flex; align-items: center; justify-content: center; gap: 22px">
<div style="position: relative; width: 120px; height: 120px; overflow: hidden; border-radius: 50%; background: #2A3550"><div style="position: absolute; left: -30px; top: -30px"><dc-import name="Logo" variant="1a" mode="monoDark" tile="false" tint="#C9D7FF" scale="0.82" size="180" hint-size="180px,180px"></dc-import></div></div>
<div style="position: relative; width: 48px; height: 48px; overflow: hidden; border-radius: 50%; background: #2A3550"><div style="position: absolute; left: -12px; top: -12px"><dc-import name="Logo" variant="1a" mode="monoDark" tile="false" tint="#C9D7FF" scale="0.82" size="72" hint-size="72px,72px"></dc-import></div></div>
</div>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A3AFBD">Android themed icon · dark</span>
</div>
</div>

<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 300px; gap: 24px">
<div style="height: 130px; border-radius: 20px; background: #FFFFFF; padding: 0 36px; display: flex; align-items: center; gap: 18px">
<dc-import name="Logo" variant="1a" mode="monoLight" tile="false" size="76" hint-size="76px,76px"></dc-import>
<span style="font-family: Sora, sans-serif; font-weight: 600; font-size: 46px; letter-spacing: -0.025em; color: #121820">MoveWise</span>
</div>
<div style="height: 130px; border-radius: 20px; background: #000000; box-shadow: inset 0 0 0 1px #2A3441; padding: 0 36px; display: flex; align-items: center; gap: 18px">
<dc-import name="Logo" variant="1a" mode="monoDark" tile="false" size="76" hint-size="76px,76px"></dc-import>
<span style="font-family: Sora, sans-serif; font-weight: 600; font-size: 46px; letter-spacing: -0.025em; color: #E9EDF2">MoveWise</span>
</div>
<div style="height: 130px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 22px">
<dc-import name="Logo" variant="1a" mode="monoLight" tile="false" size="32" hint-size="32px,32px"></dc-import>
<dc-import name="Logo" variant="1a" mode="monoLight" tile="false" size="24" hint-size="24px,24px"></dc-import>

</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":760}}'>

  renderVals() { return {}; }
