<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Piece palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}button{cursor:pointer;font-family:inherit}</style>
</helmet>
<div role="radiogroup" aria-label="Piece to place" style="width: 366px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="14">
<button type="button" role="radio" aria-checked="{{it.on}}" aria-label="{{it.label}}" style="height: 46px; border-radius: 12px; border: none; background: {{it.bg}}; box-shadow: {{it.ring}}; display: flex; align-items: center; justify-content: center; padding: 0; visibility: {{it.vis}}">
<sc-if value="{{it.isPiece}}" hint-placeholder-val="{{true}}">
<svg viewBox="0 0 48 48" width="36" height="36" aria-hidden="true" style="display: block; overflow: visible; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.35))"><path d="{{it.pc.b}}" style="fill: {{it.pc.fill}}; stroke: {{it.pc.stroke}}; stroke-width: {{it.pc.sw}}; stroke-linejoin: round; paint-order: stroke"></path><path d="{{it.pc.d}}" style="fill: none; stroke: {{it.pc.dcol}}; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"></path></svg>
</sc-if>
<sc-if value="{{it.isEraser}}" hint-placeholder-val="{{false}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{fg}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4l5 5-9.5 9.5H6.5L3 15l9.5-9.5zM9 8l7 7M7 20h13"></path></svg>
</sc-if>
</button>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sel":{"editor":"enum","options":["K","Q","R","B","N","P","k","q","r","b","n","p","x"],"default":"N"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":366,"height":98}}'>
class Component extends DCLogic {
  renderVals() {
    var light = this.props.theme === 'light';
    var sel = this.props.sel || 'N';
    var BASE = 'M12 36.5h24a2 2 0 0 1 2 2v1.5a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2v-1.5a2 2 0 0 1 2-2z';
    var SHAPES = {
      p: { b: 'M24 8.5a6 6 0 1 1 0 12a6 6 0 1 1 0-12zM18 21.5h12l-1.5 3h-9zM19.5 25.5h9c.5 4.2 2 7.6 4.5 10.5H15c2.5-2.9 4-6.3 4.5-10.5z' + BASE, d: '' },
      r: { b: 'M12 7h5v4h3.5V7h7v4H31V7h5v8l-3 3H15l-3-3zM15 19h18l1.4 15.5H13.6zM11 35.5h26a2 2 0 0 1 2 2v2.5a2 2 0 0 1-2 2H11a2 2 0 0 1-2-2v-2.5a2 2 0 0 1 2-2z', d: '' },
      b: { b: 'M24 3.5a2.6 2.6 0 1 1 0 5.2a2.6 2.6 0 1 1 0-5.2zM24 9.5c5 3.5 8 7.8 8 12c0 2.8-1.6 4.6-3.6 5H19.6c-2-.4-3.6-2.2-3.6-5c0-4.2 3-8.5 8-12zM16.5 27.5h15a1 1 0 0 1 1 1v.5a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1v-.5a1 1 0 0 1 1-1zM19 31h10l2.5 4.5h-15z' + BASE, d: 'M27 14.5l-4.5 5.5' },
      n: { b: 'M34.54 36.8L36.38 30.36L38.22 28.98L36.38 26.22L37.3 22.54L35 20.7L35 17.02L32.7 15.64L31.78 11.96L29.02 10.58L28.1 5.06L26.26 2.3L24.88 7.36L22.12 8.28L11.54 20.24L9.24 23.46L9.24 26.68L12 28.06L15.22 26.91L14.99 29.21L19.36 29.44L23.96 25.76L25.34 24.38L21.2 28.98L17.98 32.66L16.14 36.8Z' + BASE, d: 'M11.54 24.61L10.62 25.07M21.2 12.42L19.59 13.57L21.2 14.72L22.81 13.57Z' },
      q: { b: 'M10 9.8a2.2 2.2 0 1 1 0 4.4a2.2 2.2 0 1 1 0-4.4zM17 6.3a2.2 2.2 0 1 1 0 4.4a2.2 2.2 0 1 1 0-4.4zM24 4.8a2.2 2.2 0 1 1 0 4.4a2.2 2.2 0 1 1 0-4.4zM31 6.3a2.2 2.2 0 1 1 0 4.4a2.2 2.2 0 1 1 0-4.4zM38 9.8a2.2 2.2 0 1 1 0 4.4a2.2 2.2 0 1 1 0-4.4zM10.5 15L14.5 28h19l4-13l-6.5 6.8L30.5 11.5l-4 9.5L24 10l-2.5 11l-4-9.5l-.5 10.3zM14.5 29h19l-1 3.5h-17zM15.8 33.5h16.4l1.3 2.3H14.5z' + BASE, d: '' },
      k: { b: 'M22.6 2.5h2.8v2.8h2.8v2.8h-2.8v3.4h-2.8V8.1h-2.8V5.3h2.8zM24 12.5c-2.8 0-4.6 2.2-4.6 4.6c0 .9.2 1.7.6 2.4C17.4 18 12.6 18.2 11.4 22c-1 3.3 1.6 5.8 3.6 6.5h18c2-.7 4.6-3.2 3.6-6.5c-1.2-3.8-6-4-8.6-2.5c.4-.7.6-1.5.6-2.4c0-2.4-1.8-4.6-4.6-4.6zM15 29.5h18l-1 3h-16zM16 33.5h16l1.3 2.3H14.7z' + BASE, d: 'M24 18v10' }
    };
    var NAMES = { k: 'king', q: 'queen', r: 'rook', b: 'bishop', n: 'knight', p: 'pawn' };
    var piece = function (ch) {
      var white = ch === ch.toUpperCase(), s = SHAPES[ch.toLowerCase()];
      return white ? { b: s.b, d: s.d, fill: '#F5F7FA', stroke: '#1A212B', sw: 3, dcol: '#1A212B' }
        : { b: s.b, d: s.d, fill: '#1E2530', stroke: 'rgba(226,232,240,0.72)', sw: 2.4, dcol: '#8FA0B5' };
    };
    var focus = light ? '#2F5BD3' : '#86A8FF';
    var tile = light ? '#E6EAF0' : '#1C242E';
    var order = ['K', 'Q', 'R', 'B', 'N', 'P', 'x', 'k', 'q', 'r', 'b', 'n', 'p', '-'];
    return {
      fg: light ? '#121820' : '#E9EDF2',
      items: order.map(function (ch) {
        var on = ch === sel;
        var isEraser = ch === 'x', blank = ch === '-';
        return {
          on: on ? 'true' : 'false', vis: blank ? 'hidden' : 'visible',
          label: isEraser ? 'Eraser: remove a piece' : (blank ? '' : (ch === ch.toUpperCase() ? 'White ' : 'Black ') + NAMES[ch.toLowerCase()]),
          bg: on ? (light ? 'rgba(47,91,211,0.12)' : 'rgba(134,168,255,0.16)') : tile,
          ring: on ? 'inset 0 0 0 2px ' + focus : 'none',
          isPiece: !isEraser && !blank, isEraser: isEraser,
          pc: (!isEraser && !blank) ? piece(ch) : { b: '', d: '', fill: 'none', stroke: 'none', sw: 0, dcol: 'none' }
        };
      })
    };
  }
}
</script>
</body>
</html>
