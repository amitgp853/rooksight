<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan a board · camera</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./motion.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>body{margin:0;background:#000}button{font-family:inherit;cursor:pointer}a{text-decoration:none}</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #050709; color: #F5F7FA; font-family: 'Instrument Sans', system-ui, sans-serif">

<div style="position: absolute; left: 0; top: 0">
<dc-import name="ScanPhoto" width="390" height="822" board="318" tilt="true" hint-size="390px,822px"></dc-import>
</div>

<div aria-hidden="true" style="position: absolute; left: 22px; top: 238px; width: 346px; height: 346px; border-radius: 18px; box-shadow: 0 0 0 999px rgba(5,7,9,0.58)"></div>
<div aria-hidden="true" style="position: absolute; left: 22px; top: 238px; width: 346px; height: 346px">
<span style="position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-left: 4px solid #F5F7FA; border-top: 4px solid #F5F7FA; border-top-left-radius: 18px"></span>
<span style="position: absolute; right: 0; top: 0; width: 40px; height: 40px; border-right: 4px solid #F5F7FA; border-top: 4px solid #F5F7FA; border-top-right-radius: 18px"></span>
<span style="position: absolute; left: 0; bottom: 0; width: 40px; height: 40px; border-left: 4px solid #F5F7FA; border-bottom: 4px solid #F5F7FA; border-bottom-left-radius: 18px"></span>
<span style="position: absolute; right: 0; bottom: 0; width: 40px; height: 40px; border-right: 4px solid #F5F7FA; border-bottom: 4px solid #F5F7FA; border-bottom-right-radius: 18px"></span>
</div>

<header style="position: absolute; left: 0; right: 0; top: 0; height: 64px; padding: 8px 12px 0; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between">
<a href="Home.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(8,11,15,0.55); color: #F5F7FA; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<span style="font-family: Sora, sans-serif; font-weight: 600; font-size: 16px; text-shadow: 0 1px 6px rgba(0,0,0,0.6)">Scan a board</span>
<button type="button" aria-label="Flash" aria-pressed="{{flashOn}}" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: {{flashBg}}; color: {{flashFg}}; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 13h6l-1 8 8-10h-6z"></path></svg></button>
</header>

<div style="position: absolute; left: 24px; right: 24px; top: 176px; display: flex; justify-content: center">
<span style="padding: 8px 14px; border-radius: 18px; background: rgba(8,11,15,0.72); font-size: 14px; font-weight: 500">Fit the whole board inside the frame</span>
</div>

<div style="position: absolute; left: 0; right: 0; top: 604px; display: flex; justify-content: center">
<button type="button" style="height: 36px; padding: 0 12px; border: none; border-radius: 18px; background: transparent; color: #C9D7FF; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.6)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.5M12 17h.01"></path></svg>Tips for a good scan</button>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 176px; padding: 0 32px 28px; box-sizing: border-box; background: linear-gradient(180deg, rgba(5,7,9,0) 0%, rgba(5,7,9,0.85) 45%); display: flex; align-items: center; justify-content: space-between">
<a href="ScanCrop.dc.html" aria-label="Upload a photo from your gallery" style="width: 56px; height: 56px; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 2px rgba(245,247,250,0.85); display: block">
<dc-import name="ScanPhoto" width="56" height="56" board="46" hint-size="56px,56px"></dc-import>
</a>
<a href="ScanCrop.dc.html" aria-label="Take photo" style="width: 80px; height: 80px; border-radius: 40px; box-sizing: border-box; border: 4px solid #F5F7FA; display: flex; align-items: center; justify-content: center">
<span style="width: 62px; height: 62px; border-radius: 31px; background: #F5F7FA"></span></a>
<span aria-hidden="true" style="width: 56px; height: 56px"></span>
</div>

<sc-if value="{{tips}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(5,7,9,0.6); z-index: 30"></div>
<section role="dialog" aria-labelledby="tips-h" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 31; box-sizing: border-box; padding: 10px 20px 28px; border-radius: 24px 24px 0 0; background: #151B22; border-top: 1px solid #2A3441; color: #E9EDF2; display: flex; flex-direction: column; gap: 14px; animation: mw-sheet 2400ms infinite">
<span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #2A3441"></span>
<h2 id="tips-h" style="margin: 0; font-family: Sora, sans-serif; font-weight: 600; font-size: 20px">Tips for a good scan</h2>
<sc-for list="{{tipList}}" as="t" hint-placeholder-count="3">
<div style="display: flex; gap: 14px; align-items: flex-start">
<span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #1C242E; color: #86A8FF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 2px; padding-top: 2px">
<span style="font-size: 15px; font-weight: 600">{{t.title}}</span>
<span style="font-size: 14px; line-height: 20px; color: #A3AFBD">{{t.text}}</span>
</div>
</div>
</sc-for>
<button type="button" style="margin-top: 6px; height: 52px; border: none; border-radius: 12px; background: #86A8FF; color: #0B1224; font-family: Sora, sans-serif; font-weight: 600; font-size: 16px">Got it</button>
</section>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["camera","tips"],"default":"camera"},"flash":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var f = this.props.flash === true || this.props.flash === 'true';
    return {
      tips: this.props.view === 'tips',
      flashOn: f ? 'true' : 'false', flashBg: f ? '#E3B25C' : 'rgba(8,11,15,0.55)', flashFg: f ? '#1A1204' : '#F5F7FA',
      tipList: [
        { title: 'Good, even light', text: 'Daylight or a lamp above works best. Avoid glare and strong shadows on the pieces.', icon: 'M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3L4.9 4.9M19.1 19.1l-1.4-1.4M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z' },
        { title: 'The whole board in view', text: 'All 64 squares and every piece, with a little space around the edge.', icon: 'M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M8 8h8v8H8z' },
        { title: 'Shoot from above', text: 'Hold the phone flat over the board. A steep angle hides pieces behind each other.', icon: 'M12 3v10M8 9l4 4 4-4M4 17h16M6 21h12' }
      ]
    };
  }
}
</script>
</body>
</html>
