<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan a board · crop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>body{margin:0;background:#0E1217}button{font-family:inherit;cursor:pointer}a{text-decoration:none}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0F13; color: #E9EDF2; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="height: 56px; flex-shrink: 0; padding: 0 8px; display: flex; align-items: center; gap: 4px">
<a href="ScanCamera.dc.html" aria-label="Retake" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #E9EDF2">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex-grow: 1; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: Sora, sans-serif; font-weight: 600; font-size: 17px; line-height: 22px">Crop to the board</h1>
<span style="font-size: 12px; color: #A3AFBD">Drag the corners so only the 64 squares are inside</span>
</div>
</header>

<div style="flex-grow: 1; display: flex; align-items: center; justify-content: center">
<div style="position: relative; width: 374px; height: 460px; border-radius: 16px; overflow: hidden">
<dc-import name="ScanPhoto" width="374" height="460" board="330" tilt="true" hint-size="374px,460px"></dc-import>
<div aria-hidden="true" style="position: absolute; left: 34px; top: 76px; width: 306px; height: 306px; box-shadow: 0 0 0 999px rgba(5,7,9,0.62), inset 0 0 0 2px #F5F7FA">
<span style="position: absolute; left: 33.3%; top: 0; bottom: 0; width: 1px; background: rgba(245,247,250,0.35)"></span>
<span style="position: absolute; left: 66.6%; top: 0; bottom: 0; width: 1px; background: rgba(245,247,250,0.35)"></span>
<span style="position: absolute; top: 33.3%; left: 0; right: 0; height: 1px; background: rgba(245,247,250,0.35)"></span>
<span style="position: absolute; top: 66.6%; left: 0; right: 0; height: 1px; background: rgba(245,247,250,0.35)"></span>
</div>
<sc-for list="{{handles}}" as="hd" hint-placeholder-count="4">
<button type="button" aria-label="{{hd.label}}" style="position: absolute; left: {{hd.x}}px; top: {{hd.y}}px; width: 44px; height: 44px; margin: -22px 0 0 -22px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
<span style="width: 22px; height: 22px; border-radius: 11px; background: #F5F7FA; box-shadow: 0 0 0 3px rgba(134,168,255,0.9), 0 2px 8px rgba(0,0,0,0.5)"></span></button>
</sc-for>
</div>
</div>

<div style="flex-shrink: 0; padding: 0 16px; display: flex; justify-content: center; gap: 12px">
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #2A3441; background: #151B22; color: #E9EDF2; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"></path></svg>Rotate left</button>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid #2A3441; background: #151B22; color: #E9EDF2; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"></path></svg>Rotate right</button>
</div>

<footer style="flex-shrink: 0; padding: 20px 16px 28px; display: grid; grid-template-columns: 1fr 2fr; gap: 10px">
<a href="ScanCamera.dc.html" style="height: 56px; border-radius: 14px; border: 1px solid #2A3441; background: #151B22; color: #E9EDF2; display: flex; align-items: center; justify-content: center; font-family: Sora, sans-serif; font-weight: 600; font-size: 15px">Retake</a>
<a href="ScanScanning.dc.html" style="height: 56px; border-radius: 14px; background: #86A8FF; color: #0B1224; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: Sora, sans-serif; font-weight: 600; font-size: 17px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2 7 7 3-7 3-2 7-2-7-7-3 7-3z"></path></svg>Scan board</a>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { handles: [
      { x: 34, y: 76, label: 'Top-left corner' }, { x: 340, y: 76, label: 'Top-right corner' },
      { x: 34, y: 382, label: 'Bottom-left corner' }, { x: 340, y: 382, label: 'Bottom-right corner' }
    ] };
  }
}
</script>
</body>
</html>
