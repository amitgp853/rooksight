<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share report card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Symbols+2&display=swap">
<style>
body{margin:0;background:#0E1217;color:#E9EDF2;font-family:'Instrument Sans',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
a{color:#86A8FF;text-decoration:none}a:hover{color:#A9C0FF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0F13; color: #E9EDF2; display: flex; flex-direction: column">

<header style="height: 56px; flex-shrink: 0; padding: 0 8px; display: flex; align-items: center; gap: 4px">
<a href="Review.dc.html" aria-label="Back to review" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #E9EDF2">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-family: Sora, sans-serif; font-weight: 600; font-size: 17px">Report card</h1>
</header>

<div style="flex-grow: 1; padding: 8px 16px 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
<div style="width: 358px; height: 448px; border-radius: 16px; overflow: hidden; box-shadow: 0 0 0 1px #2A3441, 0 24px 48px rgba(0,0,0,0.5)">
<div style="width: 1080px; height: 1350px; transform: scale(0.33148); transform-origin: 0 0">
<dc-import name="ReportCard" hint-size="1080px,1350px"></dc-import>
</div>
</div>
<span style="font-size: 13px; color: #7C8898">1080 × 1350 · 4:5 portrait image</span>
</div>

<footer style="flex-shrink: 0; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 10px">
<button type="button" style="height: 56px; border-radius: 14px; border: none; background: #86A8FF; color: #0B1224; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: Sora, sans-serif; font-weight: 600; font-size: 17px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8h16v-8M12 3v13M7 8l5-5 5 5"></path></svg>Share image</button>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 52px; border-radius: 14px; border: 1px solid #2A3441; background: #151B22; color: #E9EDF2; font-family: Sora, sans-serif; font-weight: 600; font-size: 15px">Save to Photos</button>
<button type="button" style="height: 52px; border-radius: 14px; border: 1px solid #2A3441; background: #151B22; color: #E9EDF2; font-family: Sora, sans-serif; font-weight: 600; font-size: 15px">Copy PGN</button>
</div>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
