<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MoveWise report card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Symbols+2&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; position: relative; overflow: hidden; background: #0E1217; color: #E9EDF2; font-family: 'Instrument Sans', system-ui, sans-serif; padding: 88px 88px 80px; display: flex; flex-direction: column; gap: 48px">

<div aria-hidden="true" style="position: absolute; top: -120px; right: -120px; width: 560px; height: 560px; transform: rotate(12deg); opacity: 0.07; background-image: repeating-conic-gradient(#E9EDF2 0% 25%, transparent 0% 50%); background-size: 140px 140px"></div>

<header style="position: relative; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 16px">
<dc-import name="Logo" variant="brand" mode="dark" size="72" hint-size="72px,72px"></dc-import>
<span style="font-family: Sora, sans-serif; font-weight: 600; font-size: 36px; letter-spacing: -0.01em">MoveWise</span>
</div>
<span style="font-size: 22px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #A3AFBD">Game report</span>
</header>

<div style="position: relative; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 28px; color: #A3AFBD">{{sub}}</span>
<div style="display: flex; align-items: baseline; gap: 28px">
<span style="font-family: Sora, sans-serif; font-weight: 600; font-size: 180px; line-height: 1; letter-spacing: -0.05em; color: #E9EDF2">78.4<span style="font-size: 96px; color: #86A8FF">%</span></span>
</div>
<span style="font-size: 30px; font-weight: 500; color: #A3AFBD">accuracy</span>
</div>

<div style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px">
<div style="background: #151B22; border-radius: 32px; padding: 40px 48px 36px; display: flex; flex-direction: column; gap: 24px">
<dc-import name="Board" size="340" radius="16" coords="false" fen="r1bq1rk1/ppp2ppp/2np1n2/2b1p1B1/2B1P3/2PP1N2/PP3PPP/RN1Q1RK1" last-from="c1" last-to="g5" mark-sq="g5" mark-kind="best" hint-size="340px,340px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 22px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #A9C0FF">Best move</span>
<span style="font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 44px">7. Bg5!</span>
</div>
</div>
<div style="background: #151B22; border-radius: 32px; padding: 40px 48px 36px; display: flex; flex-direction: column; gap: 24px">
<dc-import name="Board" size="340" radius="16" coords="false" fen="2r2rk1/pp2qppp/2n1bn2/3N4/3P4/4PN2/PP2QPPP/R5K1" last-from="c3" last-to="d5" mark-sq="d5" mark-kind="blunder" hint-size="340px,340px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 22px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #F2677A">Worst blunder</span>
<span style="font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 44px">23. Nxd5??</span>
</div>
</div>
</div>

<div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 32px">
<p style="margin: 0; font-family: Sora, sans-serif; font-weight: 500; font-size: 42px; line-height: 1.2; letter-spacing: -0.015em; color: {{quoteFg}}; text-wrap: pretty">{{quote}}</p>
<div style="display: flex; justify-content: space-between; align-items: center; padding-top: 28px; border-top: 2px solid #2A3441; font-size: 24px; color: #7C8898">
<span style="display: flex; align-items: center; gap: 12px"><sc-if value="{{isAi}}" hint-placeholder-val="{{true}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="#E3B25C" aria-hidden="true"><path d="M12 2l2 7 7 3-7 3-2 7-2-7-7-3 7-3z"></path></svg></sc-if>{{label}}</span>
<span>MoveWise · AI chess coach · 28 Sep 2026</span>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"verdict":{"editor":"enum","options":["ai","summary"],"default":"ai"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    var ai = this.props.verdict !== 'summary';
    return ai
      ? { isAi: true, label: 'AI Coach verdict', quote: '“Sharp opening play — then one greedy capture on d5 undid it all.”', quoteFg: '#E9EDF2', sub: 'vs Stockfish 1000 · Blitz 5+0 · Italian Game' }
      : { isAi: false, label: 'Game summary', quote: 'Level for 22 moves. One blunder on move 23 cost 3.3 pawns; 1 blunder and 2 mistakes in all.', quoteFg: '#D3D9E1', sub: 'vs Stockfish 1000 · Blitz 5+0 · 1. e4 e6' };
  }
}
</script>
</body>
</html>
