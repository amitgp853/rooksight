name: rooksight
description: "Rooksight: an on-device AI chess coach. Play Stockfish, import Chess.com games, get reviewed."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  camera: ^0.12.1
  chessground: ^10.2.0
  dartchess: ^0.13.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.0.0
  google_fonts: ^8.2.1
  http: ^1.6.0
  image: ^4.10.1
  image_picker: ^1.2.3
  multistockfish: ^0.5.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  sound_effect: ^0.2.0
  speech_to_text: ^7.5.0
  telemetrydecksdk: ^5.0.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  drift_dev: ^2.35.0
  build_runner: ^2.16.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    # Bundled Google Fonts, loaded by the google_fonts package by filename.
    - assets/google_fonts/
    # Rooksight piece set (outline drawn behind the fill; see design/pieces for originals).
    - assets/pieces/
    # Board sounds, generated by tool/make_sounds.py.
    - assets/sounds/
    # Stockfish's GPL-3.0 text, shown on the licence page (Settings → About).
    - LICENSE
